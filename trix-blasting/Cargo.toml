[package]
name = "trix-blasting"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy = "0.18.1"
rand = "0.10.1"
wasm-bindgen = "0.2.121"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.121"
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3", features = ["Document", "Window", "Element"] }
getrandom = { version = "0.4.2", features = ["wasm_js"] }


######### BELOW BEVY ENGINE RECOMMENDATION ###########

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
