<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trix Blasting</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #18181b;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
        }

        #loading {
            position: absolute;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #00a1de;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>Loading Trix Blasting...</div>
        <div><small>This may take a few seconds...</small></div>
    </div>

    <canvas id="game-canvas" width="400" height="800"></canvas>

    <script type="module">
        async function start() {
            try {
                const { default: init, run } = await import(`./pkg/trix_blasting.js`);
                console.info("Initializing WASM...");
                await init();
                console.info("WASM initialized, starting game...");

                run();

                document.getElementById('loading').style.display = 'none';
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('loading').innerHTML = `
                    <div>Error loading game:</div>
                    <div style="color: #00a1de;">${error.message}</div>
                    <div><small>Please try again later</small></div>
                `;
            }
        }

        start();
    </script>
</body>

</html>
